<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#efe4d4"><title>Kitten Front — Картонная дуэль</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Arial,sans-serif;background:#201c19;color:#332e28}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}#app{width:min(100%,510px);height:100dvh;height:100svh;min-height:560px;max-height:1000px;margin:auto;display:flex;flex-direction:column;background:#efe6da;overflow:hidden}header{height:66px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;gap:7px;background:#f6f0e7;border-bottom:1px solid #dac8b3}.brand{line-height:.82;font-weight:1000;letter-spacing:-.9px;font-size:18px;color:#393733}.brand span{display:block;color:#677854;margin-top:3px}.chip{background:#fff;border:1px solid #ddcfbc;border-radius:11px;padding:8px 10px;font-size:12px;font-weight:800;white-space:nowrap}#arena{position:relative;flex:1;min-height:180px;background:#c8a27d;overflow:hidden}#board{width:100%;height:100%;display:block}#turn{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:2;white-space:nowrap;padding:9px 17px;border-radius:50px;background:#fff9eeec;border:1px solid #deccb6;box-shadow:0 3px 12px #54402c22;font-size:14px;font-weight:850;color:#50483d;pointer-events:none}#aimBox{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);border:1px solid #dcc9b0;background:#fff8eee9;border-radius:16px;padding:9px 13px;display:flex;align-items:center;gap:10px;white-space:nowrap;font-size:12px;font-weight:800;box-shadow:0 2px 10px #503f3020}input[type=range]{width:min(37vw,175px);accent-color:#65864c;touch-action:auto}footer{flex:none;background:#f7f1e9;border-top:1px solid #d8c5ad;padding:10px 11px max(14px,env(safe-area-inset-bottom));box-shadow:0 -4px 15px #513d2b0b}.choices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.choice{background:#fffdf9;color:#484037;border:2px solid #e0d4c4;border-radius:15px;padding:9px 1px 8px;min-width:0;min-height:75px;font-size:11px;font-weight:850}.choice i{font-style:normal;display:block;font-size:28px;line-height:1.25;margin-bottom:5px}.choice.selected{border-color:#688b4e;background:#edf5e6;box-shadow:0 0 0 1px #688b4e inset}.choice:active,.action:active{transform:scale(.97)}.actions{display:grid;grid-template-columns:1fr 2fr;gap:9px;margin-top:10px}.action{border:none;border-radius:14px;min-height:56px;font-size:16px;font-weight:900}.light{background:#e5d9c8;color:#5b4b3d}.primary{background:#638648;color:white;box-shadow:0 4px 0 #4d6836}.primary:disabled{opacity:.6;box-shadow:none}.message{font-size:11px;color:#817362;text-align:center;margin:10px 0 0}.help{display:flex;align-items:center;justify-content:center;gap:4px}.help svg{width:15px;height:15px}@media(max-height:750px){header{height:52px;padding:6px 10px}.brand{font-size:15px}.chip{padding:6px 7px;font-size:11px}.choice{min-height:60px;padding:4px 1px;font-size:10px}.choice i{font-size:23px;margin-bottom:2px}.action{min-height:44px}.message{margin-top:5px}footer{padding-top:7px;padding-bottom:max(7px,env(safe-area-inset-bottom))}#aimBox{bottom:6px;padding:5px 10px}#turn{top:7px;padding:6px 12px}}
</style></head><body><div id="app"><header><div class="brand">KITTEN<span>FRONT</span></div><div class="chip">Раунд <span id="round">1</span></div><div class="chip">🐟 <span id="fish">3</span></div><div class="chip">🏆 <span id="score">0:0</span></div></header><main id="arena"><div id="turn" role="status" aria-live="polite">Ваш ход 🐾</div><svg id="board" viewBox="0 0 400 570" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Два пушистых котика сражаются в картонной пещере"><defs>

<g id="kitten"><g filter="url(#fur)"><path d="M-22 21Q-54 35-46 2" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round"/><ellipse cx="0" cy="18" rx="25" ry="29" fill="currentColor"/><path d="M-28-15L-30-51L-8-34L12-52L30-15Z" fill="currentColor"/><path d="M-21-38L-21-48L-12-37ZM18-38L21-47L23-36Z" fill="#d69f9d"/><ellipse cx="0" cy="-19" rx="30" ry="29" fill="currentColor"/><ellipse cx="-13" cy="-3" rx="13" ry="12" fill="#f9e9d4"/><ellipse cx="12" cy="-3" rx="13" ry="12" fill="#f9e9d4"/></g><ellipse cx="-12" cy="-19" rx="6" ry="7" fill="#fff9e8"/><ellipse cx="12" cy="-19" rx="6" ry="7" fill="#fff9e8"/><ellipse cx="-11" cy="-19" rx="2.8" ry="5.4" fill="#2a2924"/><ellipse cx="13" cy="-19" rx="2.8" ry="5.4" fill="#2a2924"/><circle cx="-12" cy="-22" r="1.5" fill="white"/><circle cx="12" cy="-22" r="1.5" fill="white"/><path d="M-5-6L5-6L0 0Z" fill="#c68f90"/><path d="M0 0q-6 6-10 1m10-1q6 6 10 1" fill="none" stroke="#69554b" stroke-width="1.4"/><path d="M-14-5L-35-10M-13 1L-38 2M14-5L35-10M13 1L38 2" stroke="#eee3d6" stroke-width="1.15"/><path d="M-25-35Q-24-64 0-64Q26-63 27-35Z" fill="#777e60"/><rect x="-30" y="-40" width="60" height="9" rx="4" fill="#5f684d"/><path d="M-2-54l5 0M0-56v5" stroke="#ebddba" stroke-width="2"/><path d="M-19 4h38v27h-38Z" fill="#7c8064" rx="4"/><rect x="-24" y="12" width="48" height="15" rx="7" fill="#7d8064"/><rect x="-16" y="16" width="12" height="9" rx="2" fill="#a2a182"/><rect x="5" y="16" width="11" height="9" rx="2" fill="#a2a182"/><ellipse cx="-14" cy="43" rx="11" ry="7" fill="currentColor"/><ellipse cx="14" cy="43" rx="11" ry="7" fill="currentColor"/></g>
</defs>
<rect width="400" height="570" fill="url(#back)"/><ellipse cx="280" cy="128" rx="170" ry="190" fill="#f7e5c7" opacity=".18" filter="url(#blur)"/><rect x="20" y="76" width="360" height="355" rx="9" fill="#d5af87" stroke="#9d754e" stroke-width="5"/><rect x="44" y="108" width="311" height="281" rx="7" fill="#c79d78"/><path d="M63 126L125 110H301L344 164V362L275 398H70Z" fill="#dcb792" opacity=".66"/><path d="M-10 280H162V505H-10ZM243 249H413V507H243ZM135 425H270V590H135Z" fill="url(#card)" stroke="#916746" stroke-width="3"/><path d="M-10 278H163v13H-10ZM241 247H412v13H241ZM134 423h137v13H134Z" fill="url(#ledge)"/><path d="M-10 280H162V505H-10ZM243 249H413V507H243ZM135 425H270V590H135Z" fill="url(#grain)"/><path d="M0 506H400V570H0" fill="#9f7653" opacity=".6"/><path d="M135 425v-52q60-79 135 0v52" fill="#866344" opacity=".55"/><path d="M0 282h164M244 251h156" stroke="#f8dabc" stroke-width="2" opacity=".6"/><path d="M13 331h30m65 27h45m122-38h30" stroke="#e7c29c" stroke-width="3" opacity=".35"/>
<g id="catOne" transform="translate(83 240)"><g color="url(#grayfur)"><use href="#kitten"/></g><g id="weaponOne"><rect x="14" y="-22" width="42" height="15" rx="5" fill="#455b43"/><rect x="49" y="-26" width="12" height="23" rx="3" fill="#334b32"/><rect x="26" y="-9" width="12" height="23" rx="3" fill="#515b40"/></g></g><g id="catTwo" transform="translate(315 211)"><g transform="scale(-1 1)" color="url(#gingerfur)"><use href="#kitten"/><rect x="15" y="-23" width="46" height="8" rx="3" fill="#474a46"/><rect x="27" y="-16" width="7" height="17" rx="2" fill="#474a46"/></g></g>

</svg><div id="aimBox"><span>Угол</span><input id="angle" aria-label="Угол выстрела" type="range" min="5" max="75" value="38"><span id="degrees">38°</span></div></main><footer><div class="choices"><button class="choice selected" type="button" data-weapon="bazooka" aria-pressed="true"><i>🚀</i>Базука</button><button class="choice" type="button" data-weapon="grenade" aria-pressed="false"><i>💣</i>Граната</button><button class="choice" type="button" data-weapon="rifle" aria-pressed="false"><i>🎯</i>Винтовка</button><button class="choice" type="button" data-weapon="jump" aria-pressed="false"><i>🐾</i>Прыжок</button></div><div class="actions"><button id="reset" class="action light" type="button">↺ Заново</button><button id="fire" class="action primary" type="button">ОГОНЬ!</button></div><p class="message help">Выберите оружие или прыжок → нажмите зелёную кнопку</p></footer></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),opts=[...document.querySelectorAll('[data-weapon]')];let weapon='bazooka',life=[100,100],round=1,score=[0,0],px=83,busy=false,ended=false,animation=0,timer=[];const say=s=>$('turn').textContent=s;function later(fn,t){timer.push(setTimeout(fn,t))}function render(){ $('round').textContent=round;$('score').textContent=score.join(':');$('hp1text').textContent=life[0];$('hp2text').textContent=life[1];$('hp1').setAttribute('width',76*life[0]/100);$('hp2').setAttribute('width',76*life[1]/100);$('catOne').setAttribute('transform',`translate(${px} 240)`);const degrees=Number($('angle').value);$('degrees').textContent=degrees+'°';$('trajectory').setAttribute('d',`M ${px+51} 214 Q ${(px+315)/2} ${175-degrees*1.7} 301 188`);$('trajectory').style.opacity=(busy||ended||weapon==='jump')?'0':'1';$('fire').textContent=weapon==='jump'?'ПРЫГНУТЬ!':'ОГОНЬ!';$('fire').disabled=busy||ended;opts.forEach(b=>{let on=b.dataset.weapon===weapon;b.classList.toggle('selected',on);b.setAttribute('aria-pressed',String(on))})}function select(next){if(busy||ended)return;weapon=next;say(next==='jump'?'Выбран прыжок 🐾':`Выбрано: ${{bazooka:'базука',grenade:'граната',rifle:'винтовка'}[next]}`);render()}opts.forEach(b=>b.addEventListener('click',()=>select(b.dataset.weapon)));$('angle').addEventListener('input',render);function fly(x1,y1,x2,y2,done,duration=520){$('shot').setAttribute('opacity','1');let start=0;const tick=now=>{if(!start)start=now;let t=Math.min(1,(now-start)/duration);$('shot').setAttribute('cx',x1+(x2-x1)*t);$('shot').setAttribute('cy',y1+(y2-y1)*t-76*Math.sin(Math.PI*t));if(t<1)animation=requestAnimationFrame(tick);else{$('shot').setAttribute('opacity','0');done()}};animation=requestAnimationFrame(tick)}function hit(target,damage){life[target]=Math.max(0,life[target]-damage);let x=target===0?px:315;$('boom').setAttribute('transform',`translate(${x} ${target===0?209:174})`);$('boom').setAttribute('opacity','1');$('dmg').textContent='-'+damage;$('dmg').setAttribute('x',x);$('dmg').setAttribute('opacity','1');render();later(()=>{$('boom').setAttribute('opacity','0');$('dmg').setAttribute('opacity','0')},480)}function after(){if(!life[0]||!life[1]){ended=true;score[life[1]===0?0:1]++;say(life[1]===0?'Победа! 🏆 Нажмите «Заново»':'Победил соперник! Нажмите «Заново»');render();return}say('Ход соперника…');later(()=>fly(280,183,px+10,210,()=>{hit(0,([15,19,22][round%3]));if(!life[0]){after();return}round++;busy=false;say('Ваш ход 🐾');render()},490),590)}function act(){if(busy||ended)return;busy=true;const w=weapon;say(w==='jump'?'Котик прыгает! 🐾':'Выстрел!');render();if(w==='jump'){px=Math.min(148,px+33);$('catOne').setAttribute('transform',`translate(${px} 203)`);later(()=>{render();after()},480);return}let dmg={bazooka:31,grenade:26,rifle:19}[w];let deviation=Math.abs(Number($('angle').value)-38);if(w!=='rifle'&&deviation>27)dmg=Math.round(dmg*.55);fly(px+45,211,300,178,()=>{hit(1,dmg);later(after,540)},w==='rifle'?235:510)}$('fire').addEventListener('click',act);function reset(){timer.forEach(clearTimeout);timer=[];cancelAnimationFrame(animation);life=[100,100];round=1;px=83;busy=false;ended=false;weapon='bazooka';$('angle').value=38;$('shot').setAttribute('opacity','0');$('boom').setAttribute('opacity','0');$('dmg').setAttribute('opacity','0');say('Ваш ход 🐾');render()}$('reset').addEventListener('click',reset);reset()})();
</script></body></html>
