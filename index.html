if(state==='resolve'&&now-resolveStart>1550){applyActions()}if(state==='damage'&&now-resolveStart>950){endRound(now)}particles=particles.filter(p=>p.age<1);for(const p of particles){p.age+=.016;p.x+=p.vx*.016;p.y+=p.vy*.016;p.vy+=180*.016}requestAnimationFrame(frame)}
function drawMovingCat(c,i,x,y,t){let im=imgs[c.img];if(!im.complete||!im.naturalWidth)return;ctx.save();ctx.globalAlpha=1;ctx.translate(x,y);if(i===1)ctx.scale(-1,1);ctx.rotate(.12*Math.sin(t*Math.PI));ctx.drawImage(im,-104,-137,208,137);ctx.restore()}
function tick(){const now=performance.now();if(state==='choice'){const left=Math.max(0,10-(now-roundStart)/1000);$('clock').textContent='00:'+String(Math.ceil(left)).padStart(2,'0');if(!botReady&&left<=7){botReady=true;update()}if(left===0||approved&&botReady){resolve()}}requestAnimationFrame(tick)}requestAnimationFrame(frame);requestAnimationFrame(tick)})();
